<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 430" role="img" aria-labelledby="title desc">
  <title id="title">신뢰도를 높이는 네 단계</title><desc id="desc">출처 확인, 기간과 단위, 교차 검증, 불확실성 표시를 단계별로 나타낸 예시 그래프</desc>
  <rect width="760" height="430" rx="24" fill="#f8f4e9"/><rect x="12" y="12" width="736" height="406" rx="17" fill="none" stroke="#c6b894"/>
  <text x="52" y="62" fill="#303127" font-family="serif" font-size="28">신뢰도를 높이는 네 단계</text><text x="52" y="89" fill="#9b7d49" font-family="sans-serif" font-size="12" letter-spacing="2">FACT CHECK · SAMPLE SCORE</text>
  <path d="M105 285C210 220 290 250 380 175S560 162 665 112" fill="none" stroke="#c6b894" stroke-width="3" stroke-dasharray="5 7"/>
  <g font-family="sans-serif" text-anchor="middle">
    <circle cx="105" cy="285" r="45" fill="#444837"/><text x="105" y="280" fill="#f8f4e9" font-size="23">54</text><text x="105" y="302" fill="#ded9c8" font-size="10">STEP 01</text>
    <circle cx="285" cy="235" r="51" fill="#74765e"/><text x="285" y="230" fill="#fff" font-size="25">65</text><text x="285" y="253" fill="#ebe6d8" font-size="10">STEP 02</text>
    <circle cx="470" cy="166" r="58" fill="#9b7d49"/><text x="470" y="160" fill="#fff" font-size="27">78</text><text x="470" y="184" fill="#f4ead6" font-size="10">STEP 03</text>
    <circle cx="655" cy="111" r="66" fill="#33438a"/><text x="655" y="104" fill="#fff" font-size="31">92</text><text x="655" y="129" fill="#e2e5f4" font-size="10">STEP 04</text>
    <g fill="#303127" font-size="13"><text x="105" y="357">불확실성 표시</text><text x="285" y="327">교차 검증</text><text x="470" y="286">기간·단위 확인</text><text x="655" y="218">출처 확인</text></g>
  </g>
  <path d="M52 382H708" stroke="#c6b894"/><text x="52" y="407" fill="#777568" font-family="sans-serif" font-size="12">각 검증 습관이 글의 신뢰도에 기여하는 정도를 시각화</text>
